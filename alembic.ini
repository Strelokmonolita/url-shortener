[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
# Retained for Alembic versions before path_separator was introduced.
version_path_separator = os
# An empty URL uses application settings (see alembic/env.py). Credentials
# should not live in this file; programmatic callers can inject a connection.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
